server:
  port: 10000
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test-nbki;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
